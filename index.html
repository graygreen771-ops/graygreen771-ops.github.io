<script>
  // CHANGE THESE TWO VALUES TO MATCH YOUR GITHUB ACCOUNT & REPO NAME:
  const GITHUB_USER = "YOUR_GITHUB_USERNAME";
  const GITHUB_REPO = "YOUR_REPOSITORY_NAME";

  const ADMIN_NAME = "Teacher";
  const ADMIN_PASS = "humanskin777";

  window.currentUser = localStorage.getItem("burger_user") || null;

  window.showSection = function(sectionId) {
    document.getElementById('home-section').classList.add('hidden');
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('polls-section').classList.add('hidden');
    
    document.getElementById(sectionId).classList.remove('hidden');
    document.getElementById('drawer').classList.remove('active');
    document.getElementById('overlay').classList.remove('active');

    if (sectionId === 'polls-section') {
      checkUserStatus();
      loadGitHubIssues();
    }
  }

  window.handleLogin = function(event) {
    event.preventDefault();
    const name = document.getElementById('student-name').value.trim();
    if (!name) return;

    if (name.toLowerCase() === ADMIN_NAME.toLowerCase()) {
      const password = prompt("Enter Admin Password:");
      if (password !== ADMIN_PASS) {
        alert("Incorrect password!");
        return;
      }
    }

    localStorage.setItem("burger_user", name);
    window.currentUser = name;
    alert("Account saved!");
    showSection('polls-section');
  }

  window.handleLogout = function() {
    localStorage.removeItem("burger_user");
    window.currentUser = null;
    alert("Logged out.");
    showSection('home');
  }

  function checkUserStatus() {
    const authMenuItem = document.getElementById('auth-menu-item');
    const welcomeMsg = document.getElementById('user-welcome-msg');
    const adminPanel = document.getElementById('admin-panel');

    if (window.currentUser) {
      authMenuItem.innerHTML = `<button class="menu-link" onclick="handleLogout()">Log Out (${window.currentUser})</button>`;
      welcomeMsg.innerText = `Logged in as: ${window.currentUser}`;
      
      if (window.currentUser.toLowerCase() === ADMIN_NAME.toLowerCase()) {
        adminPanel.classList.remove('hidden');
      } else {
        adminPanel.classList.add('hidden');
      }
    } else {
      authMenuItem.innerHTML = `<button class="menu-link" onclick="showSection('auth-section')">Account / Login</button>`;
      welcomeMsg.innerText = "Please set up your account name first to answer.";
      adminPanel.classList.add('hidden');
    }
  }

  async function loadGitHubIssues() {
    const listEl = document.getElementById('polls-list');
    if (!window.currentUser) {
      listEl.innerHTML = `<p style="color:#8fb3af;">Please <a href="#" onclick="showSection('auth-section')" style="color:#5eead4;">set up your account</a> first.</p>`;
      return;
    }

    listEl.innerHTML = "<p>Loading questions...</p>";

    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/issues?state=open`);
      const issues = await response.json();

      if (!Array.isArray(issues) || issues.length === 0) {
        listEl.innerHTML = "<p>No active poll questions available right now. (Teacher can create a GitHub Issue to add one!)</p>";
        return;
      }

      let html = "";
      for (const issue of issues) {
        const commentsRes = await fetch(issue.comments_url);
        const comments = await commentsRes.json();

        let commentsHtml = "";
        if (Array.isArray(comments) && comments.length > 0) {
          comments.forEach(c => {
            commentsHtml += `<div class="response-card" style="margin-top:8px; font-size:0.9em;"><strong style="color:#5eead4;">${c.user.login}:</strong> ${c.body}</div>`;
          });
        } else {
          commentsHtml = `<p style="font-size:0.8em; color:#8fb3af; margin-top:6px;">No answers submitted yet.</p>`;
        }

        html += `
          <div class="poll-card">
            <p style="font-weight: bold; margin-bottom: 8px; color:#5eead4;">Question: ${issue.title}</p>
            <textarea id="ans-${issue.number}" rows="2" placeholder="Type your answer here..."></textarea>
            <button class="action-btn" onclick="submitAnswer(${issue.number})" style="padding: 8px; font-size: 0.9em; margin-bottom:10px;">Submit Answer</button>
            <div style="border-top: 1px solid #1f3d3a; padding-top: 8px;">
              <p style="font-size:0.85em; font-weight:bold; color:#e8f4f2;">Submissions:</p>
              ${commentsHtml}
            </div>
          </div>
        `;
      }
      listEl.innerHTML = html;
    } catch (err) {
      listEl.innerHTML = "<p>Could not load questions from GitHub.</p>";
    }
  }

  window.submitAnswer = async function(issueNumber) {
    const text = document.getElementById(`ans-${issueNumber}`).value.trim();
    if (!text) {
      alert("Please type an answer.");
      return;
    }
    alert(`Answer ready! Copy your answer and post it directly on GitHub Issue #${issueNumber}.`);
  }
</script>
