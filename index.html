<title>[Your Business Name]</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color:#e8f4f2; line-height:1.6; background:#0a0e0e; }

  header {
    background: linear-gradient(rgba(5,10,10,0.75), rgba(5,10,10,0.9)), url('nn.jpeg');
    background-size: cover;
    background-position: center;
    color:#fff;
    padding:80px 20px;
    text-align:center;
    border-bottom: 3px solid #2ec4b6;
  }
  header h1 {
    font-size: clamp(1.8em, 6vw, 2.8em);
    margin-bottom:10px;
    color:#5eead4;
    text-shadow: 0 0 15px rgba(46,196,182,0.6);
    letter-spacing: 1px;
  }
  header p { font-size:1.1em; color:#b8d8d4; }

  /* Sticky nav bar - stays visible while scrolling */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background:#0f1a1a;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #2ec4b6;
    display:flex;
    justify-content:center;
    gap: 10px;
  }
  nav a {
    color:#5eead4;
    text-decoration:none;
    font-weight:bold;
    padding: 10px 16px;
    border-radius: 6px;
    transition:0.2s;
  }
  nav a:active, nav a:hover { background:#1a2e2c; color:#fff; }

  section { padding:50px 20px; max-width:900px; margin:0 auto; }
  h2 {
    color:#5eead4;
    margin-bottom:20px;
    border-bottom:3px solid #2ec4b6;
    display:inline-block;
    text-shadow: 0 0 10px rgba(46,196,182,0.4);
  }

  .services { display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
  .service-card {
    flex:1; min-width:220px;
    background:#111c1c;
    border:1px solid #1f3d3a;
    padding:25px;
    border-radius:8px;
  }
  .service-card h3 { color:#5eead4; margin-bottom:8px; }

  .contact-btn {
    display:inline-block;
    background:#2ec4b6;
    color:#0a0e0e;
    font-weight:bold;
    padding:14px 30px;
    border-radius:6px;
    text-decoration:none;
    margin-top:20px;
  }

  /* Floating touch button - always visible, follows scroll */
  .floating-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background:#2ec4b6;
    color:#0a0e0e;
    font-weight:bold;
    padding:16px 24px;
    border-radius:50px;
    text-decoration:none;
    box-shadow: 0 4px 20px rgba(46,196,182,0.5);
    z-index: 200;
    font-size: 1em;
  }
  .floating-btn:active { transform: scale(0.95); }

  footer { background:#0f1a1a; color:#7fa8a3; text-align:center; padding:20px; margin-top:40px; border-top:1px solid #1f3d3a; }
</style>
</head>

  <a href="#about">About</a>
  <a href="#contact">Contact</a>
</nav>
